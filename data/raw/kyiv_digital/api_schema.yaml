openapi: 3.0.0
info:
  title: Kyiv Digital - Open API
  version: '1'
  description: >
    General response codes:
     * `200` - OK
     * `401` - Unauthenticated (missed or invalid API token)
     * `403` - Forbidden (API token is inactive or has no required scope)
     * `404` - Not found
     * `422` - Validation error (missed or bad request parameters)
     * `429` - Too Many Requests (endpoint rate limit reached, try again later)
     * `500` - Internal Server Error (something bad happened)
     * `503` - Service Unavailable (external service is down or app is under maintenance mode)

    Required headers:
     * `Accept: application/json` or `Accept: application/xml`

    Webhooks endpoints management requires an API token issued by the Kyiv Digital team,
    passed as `Authorization: Bearer <token>` header.

    Threat causes (`causes`), several may be active at once:
     * `drone` - UAV threat
     * `mig` - MiG-31 takeoff
     * `missile` - cruise missile threat
     * `ballistic` - ballistic threat
     * `missile-drone` - missiles and drones
     * `massive-drone` - massive drone attack

    An alert announced without a type has an empty `causes` list. The list is empty whenever the state is clear.

    `last_cause` is the threat announced last among the ones still active, so it is always one of `causes`;
    it is `null` when the state is clear, the alert has no type, or every announced threat has been cleared.
    In XML responses `null` is rendered as an empty element.

tags:
  - name: Air alert
  - name: Webhooks

paths:
  /air-alert/state:
    get:
      tags:
        - Air alert
      operationId: getAirAlertState
      summary: Get air alert current state and stats
      responses:
        200:
          $ref: '#/components/responses/AirAlertState'
  /air-alert/history:
    get:
      tags:
        - Air alert
      operationId: getAirAlertsHistory
      summary: Get air alerts state history
      responses:
        200:
          $ref: '#/components/responses/AirAlertsHistory'
  /webhooks:
    get:
      tags:
        - Webhooks
      operationId: getWebhookEndpoints
      summary: Get registered webhook endpoints
      security:
        - bearerAuth: []
      responses:
        200:
          $ref: '#/components/responses/WebhookEndpoints'
    post:
      tags:
        - Webhooks
      operationId: addWebhookEndpoint
      summary: Register a webhook endpoint
      description: >
        Registers an endpoint that will receive state webhooks for every scope of your API token.
        When an air alert starts or ends, a `POST` request with the same payload as `/air-alert/state`
        response is sent to every registered endpoint. Threats added or cleared while the alert is
        active do not trigger a webhook; `causes` and `last_cause` in the start webhook reflect the threats
        known at that moment, the current values are always available from `/air-alert/state`.
        If `auth_token` is provided, it is sent as the `Authorization` header of the webhook request.
        The endpoint must use HTTPS and point to a public domain.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointInput'
      responses:
        200:
          $ref: '#/components/responses/WebhookEndpoint'
      callbacks:
        airAlertState:
          '{$request.body#/url}':
            post:
              summary: Air alert state changed
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/AirAlertStateAndStats'
              responses:
                200:
                  description: Return any 2xx status to acknowledge the webhook
  /webhooks/{id}:
    delete:
      tags:
        - Webhooks
      operationId: deleteWebhookEndpoint
      summary: Delete a webhook endpoint
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          $ref: '#/components/responses/Success'
        404:
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token issued by the Kyiv Digital team

  parameters:
    id:
      name: id
      in: path
      description: Entity id
      required: true
      schema:
        type: integer
        example: 1

  schemas:
    WebhookEndpointInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 255
          example: 'https://example.com/webhooks/kyiv-digital'
          description: HTTPS URL on a public domain that will receive webhook POST requests
        auth_token:
          type: string
          maxLength: 255
          nullable: true
          example: 'my-secret-token'
          description: Value sent as the `Authorization` header of every webhook request
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: Endpoint id
        url:
          type: string
          example: 'https://example.com/webhooks/kyiv-digital'
          description: Endpoint URL
        created_at:
          type: string
          example: '2026-08-20 14:45:05'
          format: datetime
          description: Endpoint registration date
    WebhookEndpoints:
      type: object
      xml:
        name: root
        wrapped: true
      properties:
        endpoints:
          type: array
          xml:
            name: endpoints
            wrapped: true
          items:
            allOf:
              - $ref: '#/components/schemas/WebhookEndpoint'
              - xml:
                  name: item
    AirAlertStateAndStats:
      type: object
      xml:
        name: root
        wrapped: true
      properties:
        current:
          $ref: '#/components/schemas/AirAlertCurrentState'
        stats:
          type: object
          properties:
            total_alerts:
              type: integer
              example: 1234
              description: Total alerts count
            total_lasts_for:
              type: integer
              example: 123456
              description: Total alerts duration in seconds
    AirAlertsHistory:
      type: object
      xml:
        name: root
        wrapped: true
      properties:
        items:
          type: array
          xml:
            name: items
            wrapped: true
          items:
            allOf:
              - $ref: '#/components/schemas/AirAlertState'
              - xml:
                  name: item
          example:
            - state: 0
              causes: []
              created_at: '2024-09-24 14:45:05'
            - state: 1
              causes:
                - drone
                - ballistic
              created_at: '2024-09-24 10:45:05'
    AirAlertState:
      type: object
      properties:
        state:
          type: integer
          enum:
            - 0
            - 1
          example: 0
          description: >
            Alert states:
             * 0 - Clear
             * 1 - Alert
        causes:
          type: array
          xml:
            name: causes
            wrapped: true
          items:
            type: string
            enum:
              - drone
              - mig
              - missile
              - ballistic
              - missile-drone
              - massive-drone
            xml:
              name: item
          example:
            - drone
            - ballistic
          description: Active threat causes; empty when the alert has no type or the state is clear
        created_at:
          type: string
          example: '2024-09-24 14:45:05'
          format: datetime
          description: State changed date
    AirAlertCurrentState:
      allOf:
        - $ref: '#/components/schemas/AirAlertState'
        - type: object
          properties:
            last_cause:
              type: string
              nullable: true
              enum:
                - drone
                - mig
                - missile
                - ballistic
                - missile-drone
                - massive-drone
                - null
              example: ballistic
              description: >
                The threat announced last among the ones still active, always one of `causes`;
                null when the state is clear, the alert has no type or every announced threat has been cleared


  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            title: NotFound
            description: Not found error
            properties:
              message:
                type: string
                example: 'Not Found'
            type: object

    AirAlertState:
      description: Successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AirAlertStateAndStats'
        application/xml:
          schema:
            $ref: '#/components/schemas/AirAlertStateAndStats'
    AirAlertsHistory:
      description: Successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AirAlertsHistory'
        application/xml:
          schema:
            $ref: '#/components/schemas/AirAlertsHistory'
    WebhookEndpoints:
      description: Successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookEndpoints'
        application/xml:
          schema:
            $ref: '#/components/schemas/WebhookEndpoints'
    WebhookEndpoint:
      description: Successful
      content:
        application/json:
          schema:
            type: object
            properties:
              endpoint:
                $ref: '#/components/schemas/WebhookEndpoint'
        application/xml:
          schema:
            type: object
            xml:
              name: root
            properties:
              endpoint:
                $ref: '#/components/schemas/WebhookEndpoint'
    Success:
      description: Successful
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
        application/xml:
          schema:
            type: object
            xml:
              name: root
            properties:
              success:
                type: boolean
                example: true
